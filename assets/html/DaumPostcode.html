<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주소 검색</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #wrap {
            height: 100vh;
        }
    </style>
</head>
<body>
<div id="wrap"></div>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    console.log('Daum Postcode 스크립트 로드됨');

    new daum.Postcode({
        oncomplete: function(data) {
            console.log('주소 선택됨:', data);

            const address = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
            const extraAddress = data.buildingName ? ' (' + data.buildingName + ')' : '';

            const result = {
                zonecode: data.zonecode,
                address: address + extraAddress,
                roadAddress: data.roadAddress,
                jibunAddress: data.jibunAddress,
                buildingName: data.buildingName,
                addressType: data.userSelectedType === 'R' ? '도로명' : '지번'
            };

            console.log('전송할 데이터:', result);

            // 메시지 전송
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify(result));
                console.log('메시지 전송 완료');
            } else {
                console.error('ReactNativeWebView를 찾을 수 없음');
                alert('ReactNativeWebView를 찾을 수 없습니다.');
            }
        },
        onclose: function() {
            console.log('우편번호 창 닫힘');
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({ close: true }));
            }
        },
        width: '100%',
        height: '100%'
    }).embed(document.getElementById('wrap'));

    console.log('Postcode embed 완료');
</script>
</body>
</html>
